apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-postgresql
  namespace: monitoring
spec:
  clusterIP: None
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: grafana-postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-postgresql
  namespace: monitoring
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app: grafana-postgresql
  serviceName: grafana-postgresql
  template:
    metadata:
      labels:
        app: grafana-postgresql
    spec:
      containers:
        - env:
            - name: POSTGRES_USER
              value: grafana
            - name: POSTGRES_DB
              value: grafana
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: postgres-password
                  name: grafana-credentials
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          image: docker.io/library/postgres:18.6@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
          imagePullPolicy: IfNotPresent
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - grafana
                - -d
                - grafana
            initialDelaySeconds: 30
            periodSeconds: 10
          name: postgresql
          ports:
            - containerPort: 5432
              name: postgresql
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - grafana
                - -d
                - grafana
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: data
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: local-path
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: kube-prometheus-stack
    helm:
      valuesObject:
        grafana:
          additionalDataSources:
            - access: proxy
              editable: false
              isDefault: false
              name: Loki
              type: loki
              uid: loki
              url: http://loki-gateway.monitoring.svc.cluster.local
            - access: proxy
              editable: false
              isDefault: false
              name: Jaeger
              type: jaeger
              uid: jaeger
              url: http://jaeger.monitoring.svc.cluster.local:16686
          admin:
            existingSecret: grafana-credentials
            passwordKey: admin-password
            userKey: admin-user
          envValueFrom:
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                key: postgres-password
                name: grafana-credentials
          grafana.ini:
            database:
              host: grafana-postgresql.monitoring.svc.cluster.local:5432
              name: grafana
              password: $__env{GF_DATABASE_PASSWORD}
              ssl_mode: disable
              type: postgres
              user: grafana
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 88.3.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: loki
    helm:
      valuesObject:
        backend:
          replicas: 0
        chunksCache:
          enabled: false
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          useTestSchema: true
        read:
          replicas: 0
        resultsCache:
          enabled: false
        singleBinary:
          extraVolumeMounts:
            - mountPath: /var/loki
              name: storage
          extraVolumes:
            - emptyDir: {}
              name: storage
          persistence:
            enabled: false
          replicas: 1
        write:
          replicas: 0
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 7.3.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: alloy
    helm:
      valuesObject:
        alloy:
          configMap:
            content: |
              discovery.kubernetes "pod" {
                role = "pod"
                selectors {
                  role  = "pod"
                  field = "spec.nodeName=" + coalesce(sys.env("HOSTNAME"), constants.hostname)
                }
              }

              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pod.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label  = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label  = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  target_label  = "container"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_node_name"]
                  target_label  = "node"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "job"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
                  separator     = "/"
                  target_label  = "__path__"
                  replacement   = "/var/log/pods/*$1/*.log"
                }
              }

              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.default.receiver]
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
                }
              }
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.11.1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
spec:
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  project: default
  source:
    chart: jaeger
    helm:
      valuesObject:
        allInOne:
          enabled: true
        collector:
          enabled: false
        query:
          enabled: false
        storage:
          type: memory
    repoURL: https://jaegertracing.github.io/helm-charts
    targetRevision: 4.12.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  hostnames:
    - grafana.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
