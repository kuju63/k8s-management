apiVersion: v1
kind: Namespace
metadata:
  name: tekton-ci
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-webhook-config
  namespace: tekton-ci
name: forgejo-webhook-config
namespace: tekton-ci
spec:
  encryptedData:
    provider.token: 
    webhook.secret: 
---
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: tekton-pipeline-manifest
  namespace: tekton-ci
spec:
  git_provider:
    secret:
      key: provider.token
      name: forgejo-webhook-config
    type: forgejo
    url: http://forgejo.home.internal
    webhook_secret:
      key: webhook.secret
      name: forgejo-webhook-config
  settings:
    pipelinerun_provenance: default_branch
  url: http://forgejo.home.internal/tekton/pipeline-manifest
