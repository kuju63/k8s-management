apiVersion: v1
kind: Namespace
metadata:
  name: ai-base
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-base
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: AIアプリ開発基盤
  destinations:
    - namespace: ai-base
      server: https://kubernetes.default.svc
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: langflow-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: app-template
            name: langflow
            repoURL: ghcr.io/bjw-s-labs/helm
            targetRevision: 5.1.0
            valuesObject:
              controllers:
                main:
                  containers:
                    main:
                      env:
                        LANGFLOW_AUTO_LOGIN: "true"
                        LANGFLOW_CONFIG_DIR: /data/config
                        LANGFLOW_FS_TOOL_BASE_DIR: /data/fs
                        LANGFLOW_SAVE_DB_IN_CONFIG_DIR: "True"
                        LANGFLOW_SSRF_ALLOWED_HOSTS: 192.168.0.0/22,*.home.internal
                      image:
                        repository: docker.io/langflowai/langflow
                        tag: 1.11.5
                  pod:
                    securityContext:
                      fsGroup: 0
                      fsGroupChangePolicy: OnRootMismatch
                  replicas: 1
              nameOverride: langflow
              persistence:
                data:
                  accessMode: ReadWriteOnce
                  globalMounts:
                    - path: /data/fs
                      readOnly: false
                    - path: /data/config
                      readOnly: false
                  size: 10Gi
                  storageClass: longhorn
                  type: persistentVolumeClaim
              service:
                main:
                  controller: main
                  ports:
                    http:
                      port: 7860
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        namespace: ai-base
        server: https://kubernetes.default.svc
      project: ai-base
      source:
        chart: "{{ .chart }}"
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  templatePatch: |-
    {{- with .valuesObject }}
    spec:
      source:
        helm:
          valuesObject:
    {{ . | toYaml | nindent 8 }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow-route
  namespace: ai-base
spec:
  hostnames:
    - langflow.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
