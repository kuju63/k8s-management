apiVersion: v1
kind: Namespace
metadata:
  name: ai-base
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-base
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: AIアプリ開発基盤
  destinations:
    - namespace: ai-base
      server: https://kubernetes.default.svc
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langflow
  namespace: argocd
spec:
  destination:
    namespace: ai-base
    server: https://kubernetes.default.svc
  project: ai-base
  source:
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                env:
                  LANGFLOW_AUTO_LOGIN: "true"
                  LANGFLOW_SSRF_ALLOWED_HOSTS: 192.168.0.0/22,*.home.internal
                image:
                  repository: docker.io/langflowai/langflow
                  tag: 1.11.5
        nameOverride: langflow
        service:
          main:
            controller: main
            ports:
              http:
                port: 7860
    repoURL: ghcr.io/bjw-s-labs/helm
    targetRevision: 5.1.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow-route
  namespace: ai-base
spec:
  hostnames:
    - langflow.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
