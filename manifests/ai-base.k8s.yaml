apiVersion: v1
kind: Namespace
metadata:
  name: ai-base
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ai-base
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  description: AIアプリ開発基盤
  destinations:
    - namespace: ai-base
      server: https://kubernetes.default.svc
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: langflow-postgresql
  namespace: ai-base
name: langflow-postgresql
namespace: ai-base
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: langflow-secret
  namespace: ai-base
name: langflow-secret
namespace: ai-base
spec:
  encryptedData:
    LANGFLOW_DATABASE_URL: 
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: langflow-set
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: app-template
            name: langflow-postgresql
            repoURL: ghcr.io/bjw-s-labs/helm
            targetRevision: 5.1.0
            valuesObject:
              controllers:
                main:
                  containers:
                    main:
                      envFrom:
                        - secretRef:
                            name: langflow-postgresql
                      image:
                        repository: registry.access.redhat.com/hi/postgresql
                        tag: sha256:c811c689db21e3796160f5c9403862a685be58ce0692e85f05afd12c025a8bf3
                      probes:
                        liveness:
                          custom: true
                          enabled: true
                          spec:
                            exec:
                              command:
                                - pg_isready
                            failureThreshold: 6
                            periodSeconds: 30
                            timeoutSeconds: 5
                        readiness:
                          custom: true
                          enabled: true
                          spec:
                            exec:
                              command:
                                - pg_isready
                            periodSeconds: 10
                            timeoutSeconds: 5
                        startup:
                          custom: true
                          enabled: true
                          spec:
                            exec:
                              command:
                                - pg_isready
                            failureThreshold: 60
                            periodSeconds: 5
                  type: statefulset
              nameOverride: langflow-postgresql
              persistence:
                data:
                  accessMode: ReadWriteOnce
                  globalMounts:
                    - path: /var/lib/postgresql
                  retain: true
                  size: 10Gi
                  storageClass: longhorn
                  type: persistentVolumeClaim
              service:
                main:
                  controller: main
                  ports:
                    postgresql:
                      port: 5432
          - chart: app-template
            name: langflow
            repoURL: ghcr.io/bjw-s-labs/helm
            targetRevision: 5.1.0
            valuesObject:
              controllers:
                main:
                  containers:
                    main:
                      env:
                        LANGFLOW_AUTO_LOGIN: "true"
                        LANGFLOW_SSRF_ALLOWED_HOSTS: 192.168.0.0/22,*.home.internal
                      envFrom:
                        - secretRef:
                            name: langflow-secret
                      image:
                        repository: docker.io/langflowai/langflow
                        tag: 1.11.5
              nameOverride: langflow
              service:
                main:
                  controller: main
                  ports:
                    http:
                      port: 7860
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        namespace: ai-base
        server: https://kubernetes.default.svc
      project: ai-base
      source:
        chart: "{{ .chart }}"
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  templatePatch: |-
    {{- with .valuesObject }}
    spec:
      source:
        helm:
          valuesObject:
    {{ . | toYaml | nindent 8 }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: langflow-route
  namespace: ai-base
spec:
  hostnames:
    - langflow.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: langflow
          port: 7860
