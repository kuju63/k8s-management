apiVersion: v1
kind: Namespace
metadata:
  name: dev-env
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-env
  namespace: argocd
spec:
  destinations:
    - namespace: dev-env
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - dev-env
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
