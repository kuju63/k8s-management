apiVersion: v1
kind: Namespace
metadata:
  name: dev-env
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-env
  namespace: argocd
spec:
  destinations:
    - namespace: dev-env
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - dev-env
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registory-config
  namespace: dev-env
data:
  REGISTRY_HTTP_HOST: http://registory.home.internal
  REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /registory/data
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registory
  namespace: argocd
spec:
  destination:
    namespace: dev-env
    server: https://kubernetes.default.svc
  project: dev-env
  source:
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                image:
                  repository: docker.io/registry
                  tag: "3.1"
                resources:
                  limits:
                    cpu: 500m
                    memory: 1024Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
            replicas: 3
        nameOverride: registory
        persistence:
          registory-vol:
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /registory/data
            size: 300Gi
            storageClass: nfs
            type: persistentVolumeClaim
        service:
          main:
            controller: main
            ports:
              http:
                port: 5000
    repoURL: ghcr.io/bjw-s-labs/helm
    targetRevision: 5.1.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: registory-route
  namespace: dev-env
spec:
  hostnames:
    - registory.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: registory
          port: 5000
