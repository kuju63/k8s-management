apiVersion: v1
kind: Namespace
metadata:
  name: dev-env
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-env
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: ""
      kind: PersistentVolume
  destinations:
    - namespace: dev-env
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - dev-env
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
    - https://charts.jfrog.io
    - code.forgejo.org/forgejo-helm
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-artifact-secret
  namespace: dev-env
name: jfrog-artifact-secret
namespace: dev-env
spec:
  encryptedData:
    join-key: 
    master-key: 
    password: 
    postgres-password: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-cr-secret
  namespace: dev-env
name: jfrog-cr-secret
namespace: dev-env
spec:
  encryptedData:
    join-key: 
    master-key: 
    password: 
    postgres-password: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-db-secret
  namespace: dev-env
name: forgejo-db-secret
namespace: dev-env
spec:
  encryptedData:
    password: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: forgejo-admin-secret
  namespace: dev-env
name: forgejo-admin-secret
namespace: dev-env
spec:
  encryptedData:
    password: 
    username: 
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jfrog
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: artifactory-jcr
            name: jfrog-cr
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.20
            valuesObject:
              artifactory:
                artifactory:
                  persistence:
                    storageClassName: nfs
                database:
                  secrets:
                    password:
                      key: password
                      name: jfrog-cr-secret
                global:
                  joinKeySecretName: jfrog-cr-secret
                  masterKeySecretName: jfrog-cr-secret
                nginx:
                  https:
                    enabled: false
                  resources:
                    limits:
                      cpu: 500m
                      memory: 250Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  service:
                    type: ClusterIP
                postgresql:
                  auth:
                    existingSecret: jfrog-cr-secret
                  primary:
                    persistence:
                      size: 10Gi
                      storageClass: nfs
          - chart: artifactory-oss
            name: jfrog-artifactry
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.20
            valuesObject:
              artifactory:
                artifactory:
                  persistence:
                    storageClassName: nfs
                database:
                  secrets:
                    password:
                      key: password
                      name: jfrog-artifact-secret
                nginx:
                  https:
                    enabled: false
                  resources:
                    limits:
                      cpu: 500m
                      memory: 250Mi
                    requests:
                      cpu: 200m
                      memory: 64Mi
                  service:
                    type: ClusterIP
                postgresql:
                  auth:
                    existingSecret: jfrog-artifact-secret
                  primary:
                    persistence:
                      size: 10Gi
                      storageClass: nfs
                    resources:
                      limits:
                        cpu: "3"
                        memory: 2048Mi
                      requests:
                        cpu: "2"
                        memory: 512Mi
              global:
                joinKeySecretName: jfrog-artifact-secret
                masterKeySecretName: jfrog-artifact-secret
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        namespace: dev-env
        server: https://kubernetes.default.svc
      project: dev-env
      source:
        chart: "{{ .chart }}"
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  templatePatch: |-
    {{- with .valuesObject }}
    spec:
      source:
        helm:
          valuesObject:
    {{ . | toYaml | nindent 8 }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jfrog-cr-route
  namespace: dev-env
spec:
  hostnames:
    - cr.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: jfrog-cr-artifactory-nginx
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jfrog-artifactry-route
  namespace: dev-env
spec:
  hostnames:
    - artifactry.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: jfrog-artifactry-artifactory-nginx
          port: 80
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-postgresql
  namespace: argocd
spec:
  destination:
    namespace: dev-env
    server: https://kubernetes.default.svc
  project: dev-env
  source:
    chart: app-template
    helm:
      valuesObject:
        controllers:
          main:
            containers:
              main:
                env:
                  POSTGRES_DB: forgejo
                  POSTGRES_PASSWORD:
                    valueFrom:
                      secretKeyRef:
                        key: password
                        name: forgejo-db-secret
                  POSTGRES_USER: forgejo
                image:
                  repository: postgres
                  tag: 17-bookworm
                resources:
                  limits:
                    memory: 1Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
            type: statefulset
        nameOverride: forgejo-postgresql
        persistence:
          data:
            accessMode: ReadWriteOnce
            globalMounts:
              - path: /var/lib/postgresql/data
            retain: true
            size: 10Gi
            storageClass: nfs
            type: persistentVolumeClaim
        service:
          main:
            controller: main
            ports:
              postgresql:
                port: 5432
    repoURL: ghcr.io/bjw-s-labs/helm
    targetRevision: 5.1.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
spec:
  destination:
    namespace: dev-env
    server: https://kubernetes.default.svc
  project: dev-env
  source:
    chart: forgejo
    helm:
      valuesObject:
        additionalConfigFromEnvs:
          - name: FORGEJO__DATABASE__PASSWD
            valueFrom:
              secretKeyRef:
                key: password
                name: forgejo-db-secret
        gitea:
          admin:
            existingSecret: forgejo-admin-secret
            passwordMode: keepUpdated
          config:
            database:
              DB_TYPE: postgres
              HOST: forgejo-postgresql:5432
              NAME: forgejo
              USER: forgejo
        image:
          rootless: true
          tag: 15.0.8
        persistence:
          size: 10Gi
          storageClass: nfs
        service:
          http:
            type: ClusterIP
    repoURL: code.forgejo.org/forgejo-helm
    targetRevision: 17.1.6
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-route
  namespace: dev-env
spec:
  hostnames:
    - forgejo.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: forgejo
          port: 3000
