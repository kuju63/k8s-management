apiVersion: v1
kind: Namespace
metadata:
  name: dev-env
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-env
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: ""
      kind: PersistentVolume
  destinations:
    - namespace: dev-env
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - dev-env
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
    - https://charts.jfrog.io
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-artifact-secret
  namespace: dev-env
name: jfrog-artifact-secret
namespace: dev-env
spec:
  encryptedData:
    join-key: 
    master-key: 
    password: 
    postgres-password: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-cr-secret
  namespace: dev-env
name: jfrog-cr-secret
namespace: dev-env
spec:
  encryptedData:
    join-key: 
    master-key: 
    password: 
    postgres-password: 
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jfrog
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: artifactory-jcr
            name: jfrog-cr
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.20
            valuesObject:
              artifactory:
                artifactory:
                  persistence:
                    storageClassName: nfs
                database:
                  secrets:
                    password:
                      key: password
                      name: jfrog-cr-secret
                global:
                  joinKeySecretName: jfrog-cr-secret
                  masterKeySecretName: jfrog-cr-secret
                nginx:
                  https:
                    enabled: false
                  resources:
                    limits:
                      cpu: 500m
                      memory: 250Mi
                    requests:
                      cpu: 100m
                      memory: 128Mi
                  service:
                    type: ClusterIP
                postgresql:
                  auth:
                    existingSecret: jfrog-cr-secret
                  primary:
                    persistence:
                      size: 10Gi
                      storageClass: nfs
          - chart: artifactory-oss
            name: jfrog-artifactry
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.20
            valuesObject:
              artifactory:
                artifactory:
                  persistence:
                    storageClassName: nfs
                database:
                  secrets:
                    password:
                      key: password
                      name: jfrog-artifact-secret
                nginx:
                  https:
                    enabled: false
                  resources:
                    limits:
                      cpu: 500m
                      memory: 250Mi
                    requests:
                      cpu: 200m
                      memory: 64Mi
                  service:
                    type: ClusterIP
                postgresql:
                  auth:
                    existingSecret: jfrog-artifact-secret
                  primary:
                    persistence:
                      size: 10Gi
                      storageClass: nfs
                    resources:
                      limits:
                        cpu: "3"
                        memory: 2048Mi
                      requests:
                        cpu: "2"
                        memory: 512Mi
              global:
                joinKeySecretName: jfrog-artifact-secret
                masterKeySecretName: jfrog-artifact-secret
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        namespace: dev-env
        server: https://kubernetes.default.svc
      project: dev-env
      source:
        chart: "{{ .chart }}"
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  templatePatch: |-
    {{- with .valuesObject }}
    spec:
      source:
        helm:
          valuesObject:
    {{ . | toYaml | nindent 8 }}
    {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jfrog-cr-route
  namespace: dev-env
spec:
  hostnames:
    - cr.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: jfrog-cr-artifactory-nginx
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jfrog-artifactry-route
  namespace: dev-env
spec:
  hostnames:
    - artifactry.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: jfrog-artifactry-artifactory-nginx
          port: 80
