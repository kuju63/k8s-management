apiVersion: v1
kind: Namespace
metadata:
  name: dev-env
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dev-env
  namespace: argocd
spec:
  clusterResourceWhitelist:
    - group: ""
      kind: PersistentVolume
  destinations:
    - namespace: dev-env
      server: https://kubernetes.default.svc
  sourceNamespaces:
    - dev-env
  sourceRepos:
    - ghcr.io/bjw-s-labs/helm
    - https://charts.jfrog.io
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-artifact-secret
  namespace: dev-env
name: jfrog-artifact-secret
namespace: dev-env
spec:
  encryptedData:
    JOIN_KEY: 
    MASTER_KEY: 
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jfrog-cr-secret
  namespace: dev-env
name: jfrog-cr-secret
namespace: dev-env
spec:
  encryptedData:
    JOIN_KEY: 
    MASTER_KEY: 
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: jfrog
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - chart: artifactory-jcr
            name: jfrog-cr
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.26
            valuesObject:
              artifactory:
                global:
                  joinKeySecretName: jfrog-cr-secret
                  masterKeySecretName: jfrog-cr-secret
                persistance:
                  nfs:
                    capacity: 200Gi
                    haBackupMount: /volume1/k8s-shared/{NAMESPACE}/jfrog-cr/backup
                    haDataMount: /volume1/k8s-shared/{NAMESPACE}/jfrog-cr/data
                    ip: 192.168.1.116
                  type: nfs
          - chart: artifactory-oss
            name: jfrog-artifactry
            repoURL: https://charts.jfrog.io
            targetRevision: 107.161.26
            valuesObject:
              artifactory:
                nginx:
                  https:
                    enabled: false
                persistance:
                  nfs:
                    capacity: 200Gi
                    haBackupMount: /volume1/k8s-shared/{NAMESPACE}/jfrog-artifactry/backup
                    haDataMount: /volume1/k8s-shared/{NAMESPACE}/jfrog-artifactry/data
                    ip: 192.168.1.116
                  type: nfs
              global:
                joinKeySecretName: jfrog-artifact-secret
                masterKeySecretName: jfrog-artifact-secret
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  template:
    metadata:
      name: "{{ .name }}"
    spec:
      destination:
        namespace: dev-env
        server: https://kubernetes.default.svc
      project: dev-env
      source:
        chart: "{{ .chart }}"
        repoURL: "{{ .repoURL }}"
        targetRevision: "{{ .targetRevision }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
  templatePatch: |-
    {{- with .valuesObject }}
    spec:
      source:
        helm:
          valuesObject:
    {{ . | toYaml | nindent 8 }}
    {{- end }}
