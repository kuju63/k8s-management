apiVersion: v1
kind: Namespace
metadata:
  name: tekton-pipelines
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-pipelines
  namespace: argocd
spec:
  destination:
    namespace: tekton-pipelines
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: apiextensions.k8s.io
      jsonPointers:
        - /spec/preserveUnknownFields
      kind: CustomResourceDefinition
  project: default
  source:
    chart: tekton-pipeline
    helm:
      valuesObject:
        namespace:
          create: false
          name: tekton-pipelines
    repoURL: https://cdfoundation.github.io/tekton-helm-chart
    targetRevision: 1.14.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tekton-dashboard
  namespace: argocd
spec:
  destination:
    namespace: tekton-pipelines
    server: https://kubernetes.default.svc
  project: default
  source:
    directory:
      recurse: false
    path: packages/ns/tekton-pipelines/vendor/dashboard
    repoURL: https://github.com/kuju63/k8s-management.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard-route
  namespace: tekton-pipelines
spec:
  hostnames:
    - tekton-dashboard.home.internal
  parentRefs:
    - name: home-gateway
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: tekton-dashboard
          port: 9097
